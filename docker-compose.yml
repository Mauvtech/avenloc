version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: aven_postgres
    environment:
      POSTGRES_USER: aven_user
      POSTGRES_PASSWORD: aven_password
      POSTGRES_DB: aven_db
    ports:
      - '5433:5432'   # 5432 occupé par PostgreSQL local → on expose sur 5433
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Extensions activées automatiquement au démarrage du container PostGIS
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aven_user -d aven_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: aven_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: aven_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -s http://localhost:9200/_cluster/health | grep -q "status"']
      interval: 10s
      timeout: 10s
      retries: 10
    profiles:
      - search # docker compose --profile search up  (optionnel en V1)

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
